# ============================================================
# Ioniq 5 SUV 차량 파라미터
# ============================================================

ioniq5:
  # 차량 제원
  wheelbase:        3.000   # [m] 축간거리
  front_overhang:   0.930   # [m] 전방 오버행
  rear_overhang:    0.705   # [m] 후방 오버행
  vehicle_length:   4.635   # [m] 전장
  vehicle_width:    1.890   # [m] 전폭
  vehicle_height:   1.605   # [m] 전고
  vehicle_mass:     2100.0  # [kg] 공차중량 (AWD 기준)
  cog_height:       0.520   # [m] 무게중심 높이

  # 조향 제한
  max_steer_angle_deg: 35.0   # [deg] 최대 조향각
  max_steer_rate:      1.5    # [rad/s] 최대 조향 속도

  # 곡률 제한 (kappa = tan(steer)/wheelbase)
  kappa_max: 0.234   # tan(35°)/3.0 [1/m]
  kappa_min: -0.234

  # 속도 제한
  max_velocity:       30.0   # [m/s] 최대 전진
  min_velocity:      -3.0    # [m/s] 최대 후진
  parking_velocity:   0.5    # [m/s] 주차 추종 속도

  # 가속도 제한
  max_accel:   3.0   # [m/s²]
  max_decel:  -5.0   # [m/s²]

# ============================================================
# LTV-MPC 파라미터 (전진 주행)
# 논문: Linear_Time-Varying_MPC.pdf (Gutjahr 2017)
# ============================================================
ltv_mpc:
  N: 20              # 예측 구간
  Ts: 0.2            # 이산화 시간 [s] → 4초 예측
  w_d: 20.0          # 측방향 이탈 가중치
  w_theta: 8.0       # 방향 오차 가중치
  w_kappa: 1.5       # 곡률 가중치
  w_u: 1.0           # 입력 가중치
  u_min: -2.0        # 최소 곡률 변화율
  u_max: 2.0         # 최대 곡률 변화율
  kappa_blend_alpha: 0.15
  lateral_bound: 0.30      # [m] 측방 허용 오차
  w_lateral_slack_lin: 500.0
  w_lateral_slack_quad: 5000.0

# ============================================================
# RTI-NMPC 파라미터 (후진 주차)
# 논문: 2410.12170v1.pdf (RTI-NMPC)
# ============================================================
rti_nmpc:
  N: 20              # 예측 구간
  Ts: 0.1            # 이산화 시간 [s] → 2초 예측
  w_px: 15.0
  w_py: 15.0
  w_psi: 8.0
  w_v: 2.0
  w_kappa: 1.0
  w_av: 0.5
  w_akappa: 1.0
  av_min: -3.0
  av_max: 1.0        # 후진 중 전진 가속 제한
  akappa_min: -2.0
  akappa_max: 2.0
  parking_velocity: 0.5   # [m/s]

# ============================================================
# Hybrid A* 파라미터 (주차 경로 계획)
# 논문: 하이브리드 3편
# ============================================================
hybrid_astar:
  xy_resolution: 0.20       # [m]
  theta_deg: 5.0            # [deg]
  max_steer_deg: 35.0
  use_reed_shepp: true
  rs_every_n: 5
  w_reverse: 2.5
  w_obstacle: 80.0
  parking_velocity: 0.5

# ============================================================
# ESKF 파라미터 (GPS+IMU 헤딩 융합)
# 논문: 2406.06427v3.pdf
# ============================================================
eskf:
  sigma_accel: 0.1
  sigma_gyro: 0.01
  sigma_accel_bias: 0.001
  sigma_gyro_bias: 0.0001
  sigma_gps_pos: 1.0
  sigma_gps_vel: 0.2
  sigma_heading: 0.05
  gravity: 9.81
  utm_zone: 52

# ============================================================
# MORAI 시뮬레이터 설정
# ============================================================
morai:
  # 통신
  sim_ip: "127.0.0.1"
  mgeo_ip: "127.0.0.1"
  ego_topic: "/Ego_topic"
  ctrl_topic: "/ctrl_cmd"

  # 좌표계
  # MORAI는 UTM 좌표 사용 (Ego_topic.position_x/y가 UTM)
  utm_zone: 52

  # 카메라
  camera_topic: "/image_raw"
  camera_info_topic: "/camera_info"
