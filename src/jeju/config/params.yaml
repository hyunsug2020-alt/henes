teleop_node:
  ros__parameters:
    max_velocity: 80
    max_steering: 80
    steering_axis: 3
    manual_button_idx: 4
    auto_button_idx: 5

serial_bridge_node:
  ros__parameters:
    port: /dev/henes_arduino
    baud: 57600
    timeout: 1.0
    rx_watchdog_sec: 0.0

status_info_node:
  ros__parameters:
    imu_topic: /handsfree/imu
    gps_fix_topic: /gnss_left/fix
    gps_vel_topic: /gnss_left/fix_velocity
    gps_heading_speed_threshold_mps: 0.7
    gps_heading_speed_hysteresis_mps: 0.2
    gps_heading_alpha: 0.35
    imu_bias_alpha: 0.1
    yaw_offset_deg: 0.0
    dual_heading_topic: ''
    dual_heading_valid_topic: ''
    dual_heading_timeout_sec: 0.5
    dual_heading_alpha: 1.0

mpc_path_follower_node:
  ros__parameters:
    # ── 차량 / 제어 공통 ──────────────────────────────
    wheelbase_m: 1.04
    forward_speed_kmh: 3.0
    goal_tolerance_m: 1.0
    max_steer_deg: 55.0
    vehicle_width_m: 0.70
    vehicle_length_m: 1.30

    # ── bisa-style 3-state LTV-MPC ────────────────────
    # State: [e_y, e_psi, κ]   Input: dκ/dt
    prediction_horizon: 15
    dt: 0.1

    # 상태 비용 가중치
    Q_ey:    100.0
    Q_epsi:   10.0
    Q_kappa:   1.0
    # 종단 비용
    QN_ey:   200.0
    QN_epsi:  20.0
    QN_kappa:  2.0
    # 입력 비용
    R_dkappa:  0.5

    # 하드 제약
    kappa_max:  0.0    # 0 = max_steer_deg 에서 자동 계산 (tan(55°)/1.04 ≈ 1.37)
    dkappa_max: 1.0    # 최대 곡률 변화율 [1/m/s]

    # VelocityPlanner
    a_lat_max: 1.0     # 최대 횡가속도 [m/s²]

    # α-블렌딩 (0=신호만, 1=이전유지)
    kappa_alpha: 0.40

    # ── 속도 PI 제어 ─────────────────────────────────
    speed_kp: 30.0
    speed_ki: 2.0
    speed_integral_max: 15.0

    # ── nearest 탐색 / cusp ───────────────────────────
    nearest_search_window: 80
    cusp_cos_threshold: -0.9999

    # ── 복구 동작 ─────────────────────────────────────
    path_hold_ey_m: 2.0        # 이 값 초과 시 정지 [m]
    osc_steer_thresh_deg: 20.0 # 조향 진동 임계 [deg]
    osc_window: 6              # 진동 감지 윈도우 [샘플]
